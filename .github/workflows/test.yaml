name: Dart CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:  
  test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: 3.13.5

      - name: Bootstrap
        run: |
          dart pub global activate melos
          dart pub global activate coverage
          melos bootstrap
          
      - name: Check formatting
        run: melos run format

      - name: Generate Code
        run: melos run build

      - name: Lint
        run: melos run analyze

      - name: Run Unit tests
        run: melos run coverage --no-select

      - name: Upload Coverage
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage/dart_mappable_lcov.info,coverage/dart_mappable_builder_lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
