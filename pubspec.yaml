name: dart_mappable_workspace
publish_to: none

environment:
  sdk: '>=3.7.0 <4.0.0'

workspace:
  - packages/dart_mappable
  - packages/dart_mappable_builder

dev_dependencies:
  melos: ^8.9.0

melos:
  ide:
    intellij:
      enabled: false
      
  command:
    bootstrap:
      usePubspecOverrides: true

  scripts:
    test:
      exec:
        command: dart test
        concurrency: 1
      packageFilters:
        scope:
          - dart_mappable
          - dart_mappable_builder
          - package_comparison
    coverage:
      exec:
        command: >-
          dart test --coverage=coverage &&
          dart pub global run coverage:format_coverage --check-ignore --report-on=lib --lcov -o "$MELOS_ROOT_PATH/coverage/${MELOS_PACKAGE_NAME}_lcov.info" -i ./coverage
        concurrency: 1
      packageFilters:
        scope: 
          - dart_mappable
          - dart_mappable_builder
    build:
      exec:
        command: dart run build_runner build
      packageFilters:
        scope:
    format:
      exec:
        command: dart format . --set-exit-if-changed
    analyze:
      exec:
        command: dart analyze . --fatal-infos
